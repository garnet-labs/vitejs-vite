name: Garnet Dependency Replay

on:
  push:
    branches: ['rb/**']
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/garnet-dependency-replay.yml'

permissions:
  contents: read

concurrency:
  group: garnet-dependency-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-install:
    name: pnpm dependency install (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Garnet Runtime Visibility
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cold dependency install
        run: pnpm install --frozen-lockfile
      - name: Hold capture window for delayed children
        run: sleep 45
