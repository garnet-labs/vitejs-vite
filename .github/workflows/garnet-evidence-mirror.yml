# Mirror the head-bound Garnet Runtime Review comment into PR descriptions,
# so reviewers that read only the description ground in the same bytes.
# Runs from the default branch with a privileged token; never checks out or
# executes code from the completed run's head. Re-runs when the Garnet bot
# comment lands or updates, because the record usually arrives after the
# recording workflow completes.
name: Garnet evidence mirror

# Safe use of workflow_run: this workflow checks out the default branch only
# and never executes code from the completed run's head.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['Garnet Dependency Replay']
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: garnet-evidence-mirror-${{ github.event.workflow_run.head_sha || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror Garnet evidence
    if: >-
      (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (
          github.event.comment.user.login == 'garnet-runtime-review[bot]'
          || github.event.comment.user.login == 'garnet-runtime-review-dev[bot]'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mirror each open PR at the current head
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "issue_comment" ]; then
            pr_number='${{ github.event.issue.number }}'
            head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .head.sha)
            PR_NUMBER="${pr_number}" HEAD_SHA="${head_sha}" node .github/scripts/garnet-evidence-mirror.mjs
            exit 0
          fi
          head_sha="${RUN_HEAD_SHA}"
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${head_sha}\") | .number")
          if [ -z "${prs}" ]; then
            echo "No open PR currently points at ${head_sha}; skipping stale run."
            exit 0
          fi
          while IFS= read -r pr_number; do
            PR_NUMBER="${pr_number}" HEAD_SHA="${head_sha}" node .github/scripts/garnet-evidence-mirror.mjs
          done <<< "${prs}"
